version: '3.8'

services:
  # 1. MQTT Broker (Sensor Communicatie)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - sensor_net

  # 2. Node-RED (Data Verwerking)
  nodered:
    image: nodered/node-red:latest
    container_name: node_red
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    networks:
      - sensor_net
    depends_on:
      - mosquitto
      - influxdb

  # 3. InfluxDB (Opslag en Visualisatie)
  influxdb:
    image: influxdb:2.7
    container_name: time_series_db
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=school
      - DOCKER_INFLUXDB_INIT_BUCKET=sensordata
    networks:
      - sensor_net

  # 4. Portainer (Monitoring en Beheer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Nodig om Docker te beheren
      - portainer_data:/data
    networks:
      - sensor_net

# Netwerk en Volumes declareren
networks:
  sensor_net:
    driver: bridge

volumes:
  portainer_data:

