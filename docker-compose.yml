version: '3.8'

services:
  # MQTT Broker (Sensor Communicatie)
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - sensor_net

  # Node-RED (Data Verwerking)
  nodered:
    build: ./nodered
    image: nodered/node-red:latest
    container_name: node_red
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered/data:/data
    networks:
      - sensor_net
    depends_on:
      influxdb:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # InfluxDB (Opslag en Visualisatie)
  influxdb:
    image: influxdb:2.7
    container_name: time_series_db
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influxdb/data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_PASS}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sensor_net

  # Portainer (Monitoring en Beheer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - sensor_net

  # Grafana (Uitgebreide Visualisatie)
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana-storage:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_PASS}
    ports:
      - "9001:3000"
    networks:
      - sensor_net

  # Sensor (Automatisch opstarten)
  sensor:
    build: ./scripts
    restart: always
    depends_on:
      - mosquitto
    networks:
      - sensor_net

networks:
  sensor_net:
    driver: bridge

volumes:
  grafana-storage:
  portainer_data:
